<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대기표 등록 | 스마트 웨이팅 시스템</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="ticket">
  <div class="app">
    <header class="app-header">
      <span class="service-icon" aria-hidden="true"></span>
      <a class="brand" href="index.html" aria-label="홈으로 이동">
        <img class="brand-logo" src="assets/apple-logo.png" alt="임시 서비스 로고">
        <span><strong>스마트 웨이팅</strong><small>AI Digital Plaza</small></span>
      </a>
      <button class="header-button menu-button" data-menu-open aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav class="top-tabs" aria-label="주요 페이지">
      <a href="index.html">예약</a>
      <a class="active" href="ticket.html">대기표</a>
      <a href="info.html">안내</a>
    </nav>

    <main>
      <section class="page-head">
        <h1>대기표 등록</h1>
        <p>현장 기기에서 발행된 예약권을 기준으로 실제 대기자를 계산합니다.</p>
      </section>

      <section class="form-card">
        <label>
          콘텐츠 선택
          <select id="ticketContent">
            <option value="vr">VR 건강 체험</option>
            <option value="photo">AI 사진관</option>
            <option value="kiosk">키오스크 연습</option>
            <option value="robot">돌봄 로봇 체험</option>
          </select>
        </label>
        <label>
          발행 인원
          <input id="ticketCount" type="number" min="1" value="1">
        </label>
        <button class="primary-action" id="issueTicket">대기표 등록하기</button>
      </section>

      <section class="plain-card">
        <h2>계산 기준</h2>
        <p><strong>실시간 대기 인원 = 전체 예약 인원 - 콘텐츠 이용 완료 횟수</strong></p>
        <p>주변에 서 있는 사람 수가 아니라 실제 대기표를 가진 사람만 대기자로 계산합니다.</p>
      </section>
    </main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <button class="drawer-close" data-menu-close aria-label="메뉴 닫기">닫기</button>
      <strong>스마트 웨이팅</strong>
      <a href="index.html">예약 현황</a>
      <a href="ticket.html">대기표 등록</a>
      <a href="info.html">서비스 안내</a>
      <a href="desktop.html">데스크탑 화면</a>
    </div>
  </aside>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>

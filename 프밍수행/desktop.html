<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데스크탑 화면 | 스마트 웨이팅 시스템</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="desktop">
  <div class="desktop-shell">
    <header class="desktop-header">
      <a class="brand" href="index.html" aria-label="모바일 화면으로 이동">
        <img class="brand-logo" src="assets/apple-logo.png" alt="임시 서비스 로고">
        <span><strong>스마트 웨이팅</strong><small>AI Digital Plaza</small></span>
      </a>
      <nav class="desktop-nav" aria-label="화면 이동">
        <a href="index.html">모바일</a>
        <a class="active" href="desktop.html">데스크탑</a>
        <a href="ticket.html">대기표</a>
        <a href="info.html">안내</a>
      </nav>
    </header>

    <main class="desktop-grid">
      <section class="desktop-panel">
        <h1>데스크탑 운영 화면</h1>
        <p>모바일 사용자 화면과 구분되는 컴퓨터용 현황판입니다. 시설 운영자가 전체 대기 흐름을 한눈에 확인하는 화면으로 사용합니다.</p>
        <div class="desktop-stats">
          <div><strong>33</strong><span>대기 인원</span></div>
          <div><strong>53분</strong><span>평균 대기</span></div>
          <div><strong>14:34</strong><span>빠른 입장</span></div>
        </div>
      </section>

      <section class="desktop-panel">
        <div class="desktop-image" aria-label="임시 콘텐츠 이미지"></div>
      </section>

      <section class="desktop-panel">
        <h2>계산 기준</h2>
        <p>대기 인원 = 전체 예약 인원 - 이용 완료 횟수</p>
        <p>예상 대기 시간 = 대기 인원 x 평균 이용 시간</p>
      </section>

      <section class="desktop-panel">
        <h2>적용 분야</h2>
        <p>서울AI디지털동행플라자와 같은 고령층 친화 공간에서 콘텐츠별 대기 시간을 안내합니다.</p>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
